# Builds the Docker image and publishes it to GitHub Container Registry
# (ghcr.io/maheen-m02/anyform), tagged with the commit sha and `latest`.
# The deployment (Azure Container Apps, see docs/DEPLOYMENT.md) runs a sha tag.
name: image

on:
  push:
    branches: [main, deploy/azure]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/maheen-m02/anyform:${{ github.sha }}
            ghcr.io/maheen-m02/anyform:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
